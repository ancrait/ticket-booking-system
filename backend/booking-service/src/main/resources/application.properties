spring.application.name=booking-service

server.port=8083

spring.datasource.url=jdbc:postgresql://${BOOKING_DB_HOST}:${BOOKING_DB_PORT}/${BOOKING_DB_NAME}
spring.datasource.username=${BOOKING_DB_USER}
spring.datasource.password=${BOOKING_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.access.secret=${JWT_ACCESS_SECRET}
app.frontend-url=${FRONTEND_URL}

kafka.booking.created.topic=booking-created
kafka.booking.expired.topic=booking-expired
kafka.booking.canceled.topic=booking-canceled
kafka.consumer.payment.succeed.topic=payment-succeeded
kafka.consumer.payment.failed.topic=payment-failed
spring.kafka.consumer.group-id=booking-group

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.properties.spring.json.add.type.headers=false

service.event.api-url=http://localhost:8082/api/internal/events

logging.level.com.sorokaandriy.booking_service=INFO

