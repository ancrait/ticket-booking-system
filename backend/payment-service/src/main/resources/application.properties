spring.application.name=payment-service

server.port=8084

spring.datasource.url=jdbc:postgresql://${PAYMENT_DB_HOST}:${PAYMENT_DB_PORT}/${PAYMENT_DB_NAME}
spring.datasource.username=${PAYMENT_DB_USER}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.access.secret=${JWT_ACCESS_SECRET}
app.frontend-url=${FRONTEND_URL}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

kafka.consumer.booking.created.topic=booking-created
kafka.consumer.booking.expired.topic=booking-expired
kafka.consumer.booking.canceled.topic=booking-canceled
kafka.producer.payment.success.topic=payment-succeeded
kafka.producer.payment.failed.topic=payment-failed


spring.kafka.consumer.group-id=payment-group

service.booking.api-url=${BOOKING_SERVICE_URL}/api/bookings

stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_KEY}

stripe.currency=uah


logging.level.com.sorokaandriy.payment_service=INFO
